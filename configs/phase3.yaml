env:
  frame_skip: 3
  max_episode_steps: 15000

reward:
  damage_dealt: 1.0
  damage_progress_cap: 0.25
  enemy_killed: 0.0
  damage_taken: -0.5
  room_cleared: 2.0
  no_hit_bonus: 0.5
  pickup_collected: 2.0
  death: -5.0
  timeout_penalty: -5.0
  time_penalty: 0.0
  floor_cleared: 100.0

train:
  total_timesteps: 10000000
  learning_rate: 0.0001
  n_steps: 4096
  batch_size: 128

phase:
  spawn_enemies: false   # Use natural room spawns
