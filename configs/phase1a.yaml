env:
  frame_skip: 3
  frame_stack: 1
  free_running: true
  normalize_player_features: true
  max_episode_steps: 3000

reward:
  damage_dealt: 1.0
  damage_progress_cap: 0.25
  enemy_killed: 0.0
  room_cleared: 2.0
  no_hit_bonus: 0.5
  damage_taken: -0.5
  death: -5.0
  timeout_penalty: -5.0
  time_penalty: 0.0
  survival_bonus: 0.0

train:
  live_mode: true
  total_timesteps: 1000000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  target_kl: 0.03
  ent_coef: 0.02
  ent_coef_final: 0.005
  entropy_decay_fraction: 0.8
  save_interval_seconds: 600

phase:
  enemy_type: 10        # Gaper
  enemy_variant: 0
  enemy_count: 4
  spawn_enemies: true
  random_spawn_positions: true
  spawn_radius_min: 80.0
  spawn_radius_max: 160.0
  disable_shooting: false
  mask_shoot: false

wandb:
  enabled: true
  project: "binding-of-ai"
  run_name: "phase1a-live-fs3-diagonal"
  tags: ["phase1a", "live-mode", "frame-skip-3", "diagonal-shoot"]
