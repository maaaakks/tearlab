env:
  # Single Isaac with a 4x speedhack: 512 decisions is roughly one update
  # every 12-15 seconds while keeping several independent episodes per batch.
  n_workers: 1
  frame_skip: 3
  speed_multiplier: 8
  frame_stack: 1
  free_running: true
  normalize_player_features: true
  max_episode_steps: 150  # ~15 seconds at 30 FPS with frame_skip=3

reward:
  damage_dealt: 1.0
  damage_progress_cap: 1.0
  enemy_killed: 0.0
  room_cleared: 3.0
  no_hit_bonus: 1.0
  clear_speed_bonus: 1.0
  clear_speed_horizon: 150
  damage_taken: -0.5
  death: -8.0
  death_early_penalty: -4.0
  timeout_penalty: -4.0
  timeout_enemy_hp_penalty: -2.0
  time_penalty: 0.0
  survival_bonus: 0.0
  # Aiming is learned by the auxiliary loss below instead of an uncapped
  # per-step punishment that makes long survival progressively worse.
  aim_misalignment_penalty: 0.0
  aim_tolerance_deg: 30.0
  aim_shoot_no_enemy_penalty: 0.0

train:
  live_mode: true
  total_timesteps: 1000000
  learning_rate: 0.0001
  n_steps: 512
  batch_size: 128
  n_epochs: 4
  clip_range: 0.15
  target_kl: 0.03
  ent_coef: 0.02
  ent_coef_final: 0.005
  entropy_decay_fraction: 0.8
  aim_aux_coef: 0.10
  aim_aux_final: 0.02
  aim_aux_decay_fraction: 0.8
  aim_aux_idle_weight: 0.25
  save_interval_seconds: 600

phase:
  enemy_type: 10        # Gaper
  enemy_variant: 0
  enemy_count: 1
  spawn_enemies: true
  random_spawn_positions: true
  spawn_radius_min: 80.0
  spawn_radius_max: 160.0
  disable_shooting: false
  mask_shoot: false

wandb:
  enabled: true
  project: "binding-of-ai"
  run_name: "phase1a-1v1-speed4-v3"
  tags: ["phase1a", "1v1", "speedhack-4x", "unified-policy", "success-speed", "aux-aim"]
