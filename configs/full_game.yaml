# Full-run generalist agent (TODO stage B).
#
# One policy, one training flow, one checkpoint history. The agent learns
# combat, navigation, loot and decisions in natural multi-room runs. A cleared
# room emits room_cleared but no longer ends the episode (see env.full_run).

env:
  frame_skip: 3
  frame_stack: 3            # velocity inference across rooms
  free_running: true
  normalize_player_features: true
  enable_map_memory: true   # RunMemory room-graph map observation
  enable_goal_conditioning: true  # planner goal vector + decision features (D5)
  full_run: true            # episode = full run, not a single room
  # Global safety timeout expressed in run time. At frame_skip=3 the game
  # emits ~10 states/sec, so 54000 states ~= 90 minutes of in-game time.
  max_episode_steps: 54000

reward:
  # B4 generalist reward: per-room bounded damage progress (final blow
  # counted), clear/no-hit, boss/floor/run milestones, first-visit bonus,
  # deal protection on red hearts.
  damage_dealt: 1.0
  damage_progress_cap: 0.25   # max damage reward per ROOM, any room size
  enemy_killed: 0.0
  room_cleared: 1.0
  no_hit_bonus: 0.25
  clear_speed_bonus: 0.25
  clear_speed_horizon: 300
  damage_taken: -0.5
  room_first_visit: 0.05      # one-shot exploration bonus, no loop farming
  # Resource economy: each bomb use must pay for itself via the damage/clear
  # it enables. Small but non-zero so random bombing nets negative.
  bomb_use_penalty: -0.05
  active_use_penalty: 0.0
  pillcard_use_penalty: 0.0
  boss_killed: 0.5
  floor_cleared: 2.0
  run_won: 10.0
  deal_protected_penalty: -0.05   # per half-heart of RED heart damage
  deal_protected_floor_bonus: 0.25
  death: -10.0                # death always unacceptable (non-negotiable 6)
  death_early_penalty: -5.0   # early-run deaths are even worse
  timeout_penalty: -8.0
  timeout_enemy_hp_penalty: -2.0
  time_penalty: 0.0           # urgency exists only on successful room clears
  aim_misalignment_penalty: 0.0
  aim_tolerance_deg: 30.0
  aim_shoot_no_enemy_penalty: 0.0

train:
  live_mode: true
  total_timesteps: 5000000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.995             # multi-room consequences (TODO E8)
  gae_lambda: 0.95
  target_kl: 0.03
  ent_coef: 0.02
  ent_coef_final: 0.005
  entropy_decay_fraction: 0.8
  aim_aux_coef: 0.10
  aim_aux_final: 0.02
  aim_aux_decay_fraction: 0.8
  aim_aux_idle_weight: 0.25
  save_interval_seconds: 600
  recurrent: true              # C4: GRU over partially-observable runs
  recurrent_hidden_size: 128
  aux_coef: 0.2                # C5: auxiliary representation heads
  # E6/E7: ~10% of episode resets start from a rare scenario, decaying to 0
  # over the first 80% of training. Scenario injection (A4) is pending, so
  # the Lua hook currently falls back to a natural reset.
  controlled_reset_fraction: 0.10
  controlled_reset_final: 0.0
  controlled_reset_decay_fraction: 0.8
  controlled_scenarios: ["devil_deal", "angel_statue", "shop", "tinted_rock"]

phase:
  # Natural layouts, enemies, drops and progression: do NOT inject enemies.
  objective: THE_BEAST       # planner target when goal conditioning is on
  spawn_enemies: false
  spawn_obstacles: false
  disable_shooting: false
  mask_shoot: false
  enable_interactions: true   # bombs, active item, card/pill all active

wandb:
  enabled: true
  project: "binding-of-ai"
  run_name: "phaseB-full-run-gru-aux"
  tags: ["phaseB", "full-run", "goal-conditioned", "gru", "aux-heads"]
