# Route definition: MOM
# Short benchmark: natural progression up to and including Mom. Used as a
# regression evaluation target for combat + navigation + boss before trying
# the long MEGA_SATAN / THE_BEAST routes.

objective: MOM
description: >
  Descend naturally and defeat Mom. A compact evaluation milestone for the
  generalist policy (combat, navigation, resource use) with a clear end.

milestones:
  - id: clear_first_room
    description: Clear the first room
    success:
      condition: room_cleared
      params: { stage: 1 }
    reward: 10

  - id: reach_depth_4
    description: Descend to the fourth floor
    success:
      condition: stage_reached
      params: { stage: 4 }
    reward: 60

  - id: clear_any_boss_room
    description: Kill any boss before Mom
    success:
      condition: boss_killed
      params: { any: true }
    reward: 60

  - id: defeat_mom
    description: Defeat Mom
    requires: [reach_depth_4]
    success:
      condition: boss_killed
      params: { boss: MOM }
    reward: 150
